name: Oracle A1 capacity — bounded provisioning

on:
  workflow_dispatch:
  schedule:
    - cron: '17,37,57 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: g2exchange-oci-capacity
  cancel-in-progress: false

jobs:
  provision:
    if: vars.OCI_RETRY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: One guarded provisioning attempt
        env:
          OCI_RETRY_CONFIG: ${{ secrets.OCI_RETRY_CONFIG }}
          OCI_CAMPAIGN_START: ${{ vars.OCI_CAMPAIGN_START }}
          OCI_RETRY_ENABLED: ${{ vars.OCI_RETRY_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node infrastructure/oci-capacity.mjs
