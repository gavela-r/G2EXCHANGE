services:
  frontend:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
    container_name: frontend_valoracion

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?Configure DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      DB_NAME: ${DB_NAME:?Configure DB_NAME}
    ports:
      - "3000:3000"
    container_name: backend_valoracion

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:?Configure DB_NAME}
    ports:
      - "3307:3306"
    container_name: mysql_valoracion
